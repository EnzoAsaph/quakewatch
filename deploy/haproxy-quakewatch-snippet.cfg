# Added to /etc/haproxy/haproxy.cfg on lb-01, alongside (not replacing)
# the existing frontends used for the other course projects.
frontend quakewatch_front
    bind *:5000
    default_backend quakewatch_back

backend quakewatch_back
    balance roundrobin
    server web-01 3.82.203.173:5000 check
    server web-02 13.221.226.57:5000 check
